<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoQC Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f56d6'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>Q</text></svg>" />
    <script>
      // Windows: 웹폰트(Pretendard 서브셋)는 힌팅이 없어 12~13px에서 획 굵기가 들쭉날쭉해 보임
      // → 윈도우 자체 글꼴(Segoe UI + 맑은 고딕, ClearType 힌팅 포함)을 사용. 그 외 OS만 Pretendard 로드
      (function () {
        var win = /Win/i.test(navigator.platform || navigator.userAgent);
        if (win) { document.documentElement.classList.add('win'); return; }
        var l = document.createElement('link'); l.rel = 'stylesheet';
        l.href = 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
